name: Deploy API

# Builds the API image, pushes it to Artifact Registry and rolls it out to
# Cloud Run. Runs on version tags or manually.
#
# One-time setup (see infra/terraform/README.md):
#   1. `terraform apply` creates the registry, the Cloud Run service and the
#      keyless GitHub -> Google Cloud identity federation.
#   2. Copy the Terraform outputs into repository variables:
#        GCP_PROJECT_ID, GCP_REGION, GCP_WORKLOAD_IDENTITY_PROVIDER,
#        GCP_DEPLOY_SERVICE_ACCOUNT, AR_REPOSITORY, CLOUD_RUN_SERVICE
#   3. Publish the model as a GitHub release named in ARTIFACTS_RELEASE with
#      model.pt and movies.parquet attached.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: deploy-api
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # exchange the GitHub OIDC token for Google Cloud credentials

env:
  ARTIFACTS_RELEASE: ${{ vars.ARTIFACTS_RELEASE || 'model-v1' }}
  IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.AR_REPOSITORY }}/api

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-api.txt
      - run: |
          pip install torch==2.14.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-api.txt pytest httpx
      - run: python -m pytest tests -q
        timeout-minutes: 5

  deploy:
    name: Build and deploy
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Download model artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifacts
          gh release download "$ARTIFACTS_RELEASE" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern model.pt --pattern movies.parquet \
            --dir artifacts
          ls -lh artifacts

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet

      - name: Build and push image
        run: |
          docker build -t "$IMAGE:$GITHUB_SHA" -t "$IMAGE:latest" .
          docker push --all-tags "$IMAGE"

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ vars.CLOUD_RUN_SERVICE }}
          region: ${{ vars.GCP_REGION }}
          image: ${{ env.IMAGE }}:${{ github.sha }}

      - name: Smoke test
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 5 \
            "${{ steps.deploy.outputs.url }}/health"
